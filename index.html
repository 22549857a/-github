<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小雪安康</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5fafe 0%, #eaf6fa 100%);
            font-family: '微软雅黑', sans-serif;
            overflow: hidden;
        }
        
        .card {
            width: 90%;
            max-width: 500px;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #4299e1, #9f7aea);
        }
        
        .snow-icon {
            font-size: 4rem;
            color: #4299e1;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        h1 {
            font-size: 2rem;
            color: #2d3748;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        .blessing {
            font-size: 1.1rem;
            color: #4a5568;
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        
        .footer {
            font-size: 0.9rem;
            color: #718096;
            opacity: 0.8;
        }
        /* 雪花动画 */
        
        .snowflake {
            position: absolute;
            color: #fff;
            opacity: 0.7;
            font-size: 1rem;
            pointer-events: none;
            animation: snowfall linear infinite;
        }
        
        @keyframes snowfall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="snow-icon">❄️</div>
        <h1>小雪安康，暖意常伴</h1>
        <p class="blessing">
            霜染万物，雪落人间<br> 愿寒风不侵，岁月安暖
            <br> 三餐温热，岁岁无忧
            <br> 小雪时节，顺遂常安
        </p>
        <div class="footer">愿冬日皆暖，万事皆安</div>
    </div>

    <script>
        // 动态生成雪花
        function createSnowflakes() {
            const count = 30;
            const container = document.body;
            for (let i = 0; i < count; i++) {
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.textContent = '❄️';
                // 随机位置、大小、动画时长
                const left = Math.random() * 100;
                const size = 0.5 + Math.random() * 1;
                const duration = 5 + Math.random() * 10;
                const delay = Math.random() * 5;
                snow.style.left = `${left}%`;
                snow.style.fontSize = `${size}rem`;
                snow.style.animationDuration = `${duration}s`;
                snow.style.animationDelay = `${delay}s`;
                container.appendChild(snow);
            }
        }
        createSnowflakes();
    </script>
</body>

</html>
